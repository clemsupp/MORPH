```html
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MORPH — Every visit is different</title>

<style>
:root {
    --bg: #111;
    --panel: #1b1b1b;
    --text: #fff;
    --muted: #999;
    --accent: #7c5cff;
    --accent2: #00d4ff;
    --radius: 18px;
}

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    min-height: 100%;
}

body {
    font-family: Inter, Arial, sans-serif;
    background:
        radial-gradient(circle at 20% 20%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 30%),
        radial-gradient(circle at 80% 70%, color-mix(in srgb, var(--accent2) 12%, transparent), transparent 30%),
        var(--bg);
    color: var(--text);
    transition: background 0.8s ease, color 0.5s ease;
    overflow-x: hidden;
}

/* BACKGROUND */

.background {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -1;
    overflow: hidden;
}

.orb {
    position: absolute;
    width: 280px;
    height: 280px;
    border-radius: 50%;
    background: var(--accent);
    opacity: .08;
    filter: blur(50px);
    animation: float 12s infinite alternate ease-in-out;
}

.orb:nth-child(1) {
    top: -100px;
    left: -100px;
}

.orb:nth-child(2) {
    right: -120px;
    bottom: -100px;
    background: var(--accent2);
    animation-delay: -5s;
}

@keyframes float {
    from { transform: translate(0,0) scale(1); }
    to { transform: translate(80px,60px) scale(1.3); }
}

/* MAIN */

.app {
    width: min(1180px, calc(100% - 32px));
    margin: auto;
    padding: 28px 0 60px;
}

/* HEADER */

header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 35px;
}

.logo {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: -1px;
}

.logo span {
    color: var(--accent);
}

.visit {
    color: var(--muted);
    font-size: 13px;
    border: 1px solid rgba(255,255,255,.08);
    padding: 8px 12px;
    border-radius: 999px;
    background: rgba(255,255,255,.03);
}

/* HERO */

.hero {
    text-align: center;
    padding: 50px 20px;
    border: 1px solid rgba(255,255,255,.08);
    background: rgba(255,255,255,.035);
    backdrop-filter: blur(20px);
    border-radius: var(--radius);
    margin-bottom: 22px;
    animation: appear .7s ease;
}

.hero h1 {
    font-size: clamp(42px, 8vw, 90px);
    margin: 0;
    line-height: .9;
    letter-spacing: -5px;
}

.hero h1 span {
    color: var(--accent);
}

.hero p {
    color: var(--muted);
    margin: 22px auto 0;
    max-width: 600px;
    line-height: 1.6;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(15px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* GRID */

.grid {
    display: grid;
    gap: 18px;
}

.grid.normal {
    grid-template-columns: repeat(2, 1fr);
}

.grid.wide {
    grid-template-columns: 1.5fr .7fr;
}

.grid.three {
    grid-template-columns: repeat(3, 1fr);
}

/* CARD */

.card {
    background: rgba(255,255,255,.045);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: var(--radius);
    padding: 24px;
    backdrop-filter: blur(15px);
    animation: appear .8s ease both;
    transition: transform .2s, border-color .2s, background .2s;
}

.card:hover {
    transform: translateY(-3px);
    border-color: color-mix(in srgb, var(--accent) 45%, transparent);
    background: rgba(255,255,255,.065);
}

.card h2 {
    margin: 0 0 8px;
    font-size: 20px;
}

.card p {
    color: var(--muted);
    line-height: 1.6;
}

.big-number {
    font-size: 50px;
    font-weight: 900;
    color: var(--accent);
    margin: 15px 0;
}

.tag {
    display: inline-block;
    padding: 7px 11px;
    border-radius: 999px;
    background: color-mix(in srgb, var(--accent) 15%, transparent);
    color: var(--accent);
    font-size: 12px;
    font-weight: bold;
}

/* BUTTON */

button {
    border: 0;
    cursor: pointer;
    color: white;
    background: var(--accent);
    padding: 12px 17px;
    border-radius: 12px;
    font-weight: 700;
    transition: transform .15s, filter .15s;
}

button:hover {
    filter: brightness(1.15);
    transform: translateY(-2px);
}

button:active {
    transform: scale(.96);
}

/* RANDOM BUTTON */

.random-button {
    width: 100%;
    min-height: 70px;
    font-size: 17px;
}

/* BAR */

.bar {
    height: 9px;
    background: rgba(255,255,255,.08);
    border-radius: 999px;
    overflow: hidden;
    margin: 15px 0;
}

.bar div {
    height: 100%;
    width: var(--progress);
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: inherit;
    transition: width 1s ease;
}

/* LIST */

.list {
    display: flex;
    flex-direction: column;
    gap: 9px;
}

.item {
    padding: 12px 14px;
    border-radius: 10px;
    background: rgba(255,255,255,.04);
    display: flex;
    justify-content: space-between;
    gap: 10px;
}

.item span:last-child {
    color: var(--muted);
}

/* SECRET */

.secret {
    position: fixed;
    bottom: 18px;
    right: 18px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--accent);
    opacity: .15;
    cursor: pointer;
    transition: .3s;
}

.secret:hover {
    opacity: 1;
    transform: scale(2);
}

/* FOOTER */

footer {
    text-align: center;
    color: #666;
    font-size: 12px;
    margin-top: 30px;
}

/* TOAST */

.toast {
    position: fixed;
    left: 50%;
    bottom: 30px;
    transform: translate(-50%, 100px);
    background: #222;
    border: 1px solid rgba(255,255,255,.12);
    padding: 13px 18px;
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,.4);
    opacity: 0;
    transition: .35s;
    z-index: 20;
}

.toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
}

/* SPECIAL MODES */

body.glitch .hero {
    animation: glitch .15s infinite;
}

@keyframes glitch {
    0% { transform: translate(0); }
    25% { transform: translate(3px,-2px); }
    50% { transform: translate(-3px,2px); }
    75% { transform: translate(2px,2px); }
    100% { transform: translate(0); }
}

body.inverted {
    filter: invert(1) hue-rotate(180deg);
}

@media(max-width: 750px) {
    .grid.normal,
    .grid.wide,
    .grid.three {
        grid-template-columns: 1fr;
    }

    .hero {
        padding: 38px 18px;
    }

    .hero h1 {
        letter-spacing: -3px;
    }

    header {
        align-items: flex-start;
    }
}
</style>
</head>

<body>

<div class="background">
    <div class="orb"></div>
    <div class="orb"></div>
</div>

<div class="app">

<header>
    <div class="logo">MOR<span>PH</span></div>
    <div class="visit" id="visit"></div>
</header>

<section class="hero">
    <h1 id="title">MOR<span>PH</span></h1>
    <p id="subtitle"></p>
</section>

<div id="content"></div>

<footer>
    MORPH · Cette page ne sera probablement jamais exactement la même.
</footer>

</div>

<div class="secret" id="secret"></div>
<div class="toast" id="toast"></div>

<script>

/* =========================================================
   MORPH
   RANDOM SITE GENERATOR
   ========================================================= */

const $ = id => document.getElementById(id);

const random = arr => arr[Math.floor(Math.random() * arr.length)];

const rand = (min, max) =>
    Math.floor(Math.random() * (max - min + 1)) + min;

const chance = percent =>
    Math.random() * 100 < percent;


/* =========================================================
   VISITS
   ========================================================= */

let visits = Number(localStorage.getItem("morph_visits") || 0);
visits++;

localStorage.setItem("morph_visits", visits);

$("visit").textContent =
    `VISITE #${visits}`;


/* =========================================================
   THEMES
   ========================================================= */

const themes = [
    {
        bg:"#0d0d10",
        panel:"#17171c",
        text:"#ffffff",
        accent:"#7c5cff",
        accent2:"#00d4ff"
    },
    {
        bg:"#08110d",
        panel:"#101d16",
        text:"#f2fff7",
        accent:"#31e981",
        accent2:"#00b894"
    },
    {
        bg:"#110b0b",
        panel:"#1d1111",
        text:"#fff6f6",
        accent:"#ff4f70",
        accent2:"#ff9f43"
    },
    {
        bg:"#0b0f16",
        panel:"#111827",
        text:"#f3f7ff",
        accent:"#4da3ff",
        accent2:"#8e7dff"
    },
    {
        bg:"#12100a",
        panel:"#1d190d",
        text:"#fffdf0",
        accent:"#e0a400",
        accent2:"#ff6b35"
    },
    {
        bg:"#090d12",
        panel:"#101820",
        text:"#f3fbff",
        accent:"#00e5ff",
        accent2:"#0077ff"
    }
];

const theme = random(themes);

document.documentElement.style.setProperty("--bg", theme.bg);
document.documentElement.style.setProperty("--panel", theme.panel);
document.documentElement.style.setProperty("--text", theme.text);
document.documentElement.style.setProperty("--accent", theme.accent);
document.documentElement.style.setProperty("--accent2", theme.accent2);


/* =========================================================
   TITLES
   ========================================================= */

const titles = [
    "MORPH",
    "MORPH.",
    "MORPH_",
    "MORPH//",
    "MORPH.exe",
    "MORPH?",
    "MORPH!"
];

$("title").innerHTML =
    random(titles).replace(
        /MORPH/,
        "MOR<span>PH</span>"
    );


/* =========================================================
   SUBTITLES
   ========================================================= */

const subtitles = [
    "Cette page change à chaque visite.",
    "Tu regardes une version qui n'existera peut-être plus.",
    "Il n'y a pas de version originale.",
    "Bienvenue dans une page légèrement différente.",
    "Tout ceci aurait pu être autrement.",
    "Actualise. Regarde ce qui change.",
    "MORPH vient de choisir une nouvelle configuration.",
    "Tu es arrivé au mauvais endroit. Ou au bon.",
    "Cette interface n'a pas été dessinée deux fois.",
    "La page décide de ce qu'elle veut être."
];

$("subtitle").textContent = random(subtitles);


/* =========================================================
   DATA
   ========================================================= */

const words = [
    "instable",
    "curieux",
    "aléatoire",
    "inattendu",
    "variable",
    "étrange",
    "rapide",
    "silencieux",
    "chaotique",
    "normal",
    "presque normal"
];

const messages = [
    "Tout fonctionne normalement.",
    "Quelque chose a changé.",
    "Personne ne sait pourquoi.",
    "La page est satisfaite.",
    "Une variable vient de changer.",
    "Rien à signaler.",
    "C'est probablement volontaire.",
    "Cette information n'est pas très utile.",
    "Tu as vraiment lu ça ?"
];


/* =========================================================
   CARDS
   ========================================================= */

function card(content) {
    return `<div class="card">${content}</div>`;
}

function createStatusCard() {

    const value = rand(1, 100);

    return card(`
        <h2>État actuel</h2>
        <div class="big-number">${value}%</div>
        <p>Indice de stabilité de cette version.</p>
        <div class="bar" style="--progress:${value}%">
            <div></div>
        </div>
        <span class="tag">${random(words)}</span>
    `);
}


function createRandomCard() {

    return card(`
        <h2>Générateur</h2>
        <p>${random(messages)}</p>
        <button class="random-button" onclick="randomEvent()">
            FAIRE QUELQUE CHOSE
        </button>
    `);
}


function createNumbersCard() {

    return card(`
        <h2>Statistiques inutiles</h2>

        <div class="list">
            <div class="item">
                <span>Version</span>
                <span>${rand(1,9)}.${rand(0,9)}.${rand(0,99)}</span>
            </div>

            <div class="item">
                <span>Probabilité d'être ici</span>
                <span>${rand(1,99)}%</span>
            </div>

            <div class="item">
                <span>Temps prévu</span>
                <span>${rand(1,999)} ms</span>
            </div>

            <div class="item">
                <span>Nombre de décisions</span>
                <span>${rand(12,9999)}</span>
            </div>
        </div>
    `);
}


function createMessageCard() {

    const messages2 = [
        "Tu peux fermer cette page.",
        "Tu peux aussi rester.",
        "Il n'y a rien de plus à voir ici.",
        "Enfin... probablement.",
        "Cette carte n'était pas prévue.",
        "Pourquoi cette carte existe-t-elle ?"
    ];

    return card(`
        <h2>${random([
            "Message",
            "Information",
            "Note",
            "Observation",
            "Rapport"
        ])}</h2>

        <p>${random(messages2)}</p>

        <span class="tag">${random(words)}</span>
    `);
}


function createTimeCard() {

    const now = new Date();

    return card(`
        <h2>Moment</h2>
        <div class="big-number">
            ${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}
        </div>
        <p>La page connaît l'heure actuelle de ton appareil.</p>
    `);
}


function createVisitCard() {

    return card(`
        <h2>Historique</h2>
        <div class="big-number">${visits}</div>
        <p>Nombre de fois où MORPH a été ouvert sur cet appareil.</p>
    `);
}


/* =========================================================
   GENERATE LAYOUT
   ========================================================= */

const layouts = [
    "normal",
    "wide",
    "three"
];

const grid = document.createElement("div");

grid.className = "grid " + random(layouts);

const possibleCards = [
    createStatusCard,
    createRandomCard,
    createNumbersCard,
    createMessageCard,
    createTimeCard,
    createVisitCard
];


/* shuffle */

possibleCards.sort(() => Math.random() - .5);


/* choose number */

let amount = rand(4, 6);

possibleCards
    .slice(0, amount)
    .forEach(create => {
        grid.innerHTML += create();
    });

$("content").appendChild(grid);


/* =========================================================
   RANDOM EVENTS
   ========================================================= */

function showToast(message) {

    const toast = $("toast");

    toast.textContent = message;
    toast.classList.add("show");

    clearTimeout(window.toastTimer);

    window.toastTimer = setTimeout(() => {
        toast.classList.remove("show");
    }, 2500);
}


function randomEvent() {

    const events = [
        () => {
            document.documentElement.style.setProperty(
                "--accent",
                random([
                    "#ff4d6d",
                    "#00e5ff",
                    "#8e7dff",
                    "#31e981",
                    "#e0a400",
                    "#ff7a00"
                ])
            );

            showToast("La couleur vient de changer.");
        },

        () => {
            document.body.classList.add("glitch");

            showToast("Erreur visuelle.");

            setTimeout(() => {
                document.body.classList.remove("glitch");
            }, 900);
        },

        () => {
            showToast(random([
                "Pourquoi tu as cliqué ?",
                "Action enregistrée.",
                "C'était inutile.",
                "Très bon choix.",
                "Décision intéressante.",
                "MORPH a remarqué ça."
            ]));
        },

        () => {
            document.body.classList.add("inverted");

            showToast("Configuration inhabituelle.");

            setTimeout(() => {
                document.body.classList.remove("inverted");
            }, 700);
        }
    ];

    random(events)();
}


/* =========================================================
   CLICK TRACKING
   ========================================================= */

let clicks = 0;

document.addEventListener("click", e => {

    clicks++;

    if (clicks === 10) {
        showToast("10 clics. Tu explores vraiment.");
    }

    if (clicks === 25) {
        showToast("Tu viens de dépasser 25 clics.");
    }

    if (clicks > 0 && clicks % 50 === 0) {
        showToast(`${clicks} clics. Sérieusement ?`);
    }

});


/* =========================================================
   EASTER EGG
   ========================================================= */

let secretClicks = 0;

$("secret").addEventListener("click", () => {

    secretClicks++;

    if (secretClicks === 3) {
        showToast("Tu as trouvé quelque chose.");
    }

    if (secretClicks === 7) {

        document.body.classList.add("glitch");

        setTimeout(() => {
            document.body.classList.remove("glitch");
        }, 1800);

        showToast("MODE MORPH INSTABLE ACTIVÉ");

        localStorage.setItem(
            "morph_secret",
            "true"
        );
    }

});


/* =========================================================
   KEYBOARD SECRET
   ========================================================= */

let keys = "";

document.addEventListener("keydown", e => {

    keys += e.key.toLowerCase();

    if (keys.length > 20) {
        keys = keys.slice(-20);
    }

    if (keys.includes("morph")) {

        showToast("Tu connais le nom du site.");

        keys = "";
    }
});


/* =========================================================
   RARE EVENT
   ========================================================= */

if (chance(2)) {

    setTimeout(() => {

        document.body.classList.add("glitch");

        showToast(
            "Événement rare : cette version est instable."
        );

        setTimeout(() => {
            document.body.classList.remove("glitch");
        }, 1200);

    }, 3000);

}


/* =========================================================
   IDLE DETECTION
   ========================================================= */

let idleTimer;

function resetIdle() {

    clearTimeout(idleTimer);

    idleTimer = setTimeout(() => {

        showToast(
            random([
                "Tu es toujours là ?",
                "Aucune activité détectée.",
                "MORPH attend.",
                "Tu n'as rien fait depuis un moment."
            ])
        );

    }, 20000);
}

["mousemove","keydown","click","touchstart"].forEach(event => {
    document.addEventListener(event, resetIdle);
});

resetIdle();


/* =========================================================
   CONSOLE EASTER EGG
   ========================================================= */

console.log(
    "%c MORPH ",
    "font-size:30px;font-weight:bold;color:" +
    theme.accent
);

console.log(
    "Tu regardes la console. Intéressant."
);

console.log(
    "Version générée :",
    Math.random().toString(36).slice(2,10)
);


/* =========================================================
   RANDOM AUTO EVENT
   ========================================================= */

setTimeout(() => {

    if (chance(35)) {
        randomEvent();
    }

}, rand(5000, 15000));

</script>

</body>
</html>
```
